<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>尾牙主桌與貴賓排位系統</title>
  <link rel="stylesheet" href="style.css">
  <!-- SheetJS 用於 Excel 匯入與匯出 -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>
<body>
  <header class="app-header">
    <h1>尾牙主桌與貴賓排位系統</h1>
    <div class="toolbar">
      <label class="btn btn-file">
        匯入 Excel <input type="file" id="import-excel" accept=".xlsx, .xls">
      </label>
      <button id="add-guest-btn" class="btn">新增貴賓</button>
      <button id="add-table-btn" class="btn btn-primary">新增桌子</button>
      <button id="export-excel-btn" class="btn">匯出 Excel</button>
      <button id="export-project-btn" class="btn">匯出專案 (JSON)</button>
      <label class="btn btn-file">
        匯入專案 <input type="file" id="import-project" accept=".json">
      </label>
      <button id="reset-btn" class="btn btn-danger">重置系統</button>
    </div>
  </header>

  <div class="main-container">
    <!-- 左側邊欄：貴賓清單與篩選 -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <h3>待排入貴賓清單</h3>
        <div class="view-toggle">
          <label class="switch-label">
            顯示頭銜
            <input type="checkbox" id="toggle-titles" checked>
            <span class="slider"></span>
          </label>
        </div>
      </div>
      <div id="guest-list" class="guest-list">
        <!-- 動態渲染貴賓卡片 -->
      </div>
    </aside>

    <!-- 右側：桌圖視圖區域 -->
    <main class="canvas-viewport" id="viewport">
      <div class="canvas" id="canvas">
        <!-- 動態渲染桌子 -->
      </div>
      <!-- 右下角縮放控制面板 -->
      <div class="zoom-controls">
        <button id="zoom-in" class="zoom-btn">+</button>
        <button id="zoom-reset" class="zoom-btn">100%</button>
        <button id="zoom-out" class="zoom-btn">-</button>
      </div>
    </main>
  </div>

  <!-- 詳細資料 / 新增貴賓對話框 -->
  <dialog id="details-dialog" class="dialog">
    <form id="details-form" method="dialog">
      <h3 id="dialog-title">貴賓詳細資料</h3>
      <div class="form-group">
        <label>單位：</label>
        <input type="text" id="dialog-dept" required>
      </div>
      <div class="form-group">
        <label>頭銜：</label>
        <input type="text" id="dialog-title-input">
      </div>
      <div class="form-group">
        <label>姓名：</label>
        <input type="text" id="dialog-name" required>
      </div>
      <div class="form-group">
        <label>飲食習慣：</label>
        <input type="text" id="dialog-diet" placeholder="無特別需求填寫「無」即可">
      </div>
      <div class="form-group">
        <label>聯絡方式：</label>
        <input type="text" id="dialog-contact">
      </div>
      <div class="form-group">
        <label>其他備註：</label>
        <textarea id="dialog-notes" rows="3" placeholder="例如：抵達時間、特別提醒..."></textarea>
      </div>
      <div class="dialog-actions">
        <button type="button" id="dialog-save-btn" class="btn btn-primary">儲存</button>
        <button type="button" id="dialog-close-btn" class="btn">關閉</button>
      </div>
    </form>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
